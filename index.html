<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cstdio_luogu的主页</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
        }

        /* 动态星空背景（纯CSS，无图片） */
        body {
            background: #000; /* 纯黑底色 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
            position: relative;
            overflow: hidden; /* 隐藏溢出的星星 */
        }

        /* 生成星星 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 50px 160px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 160px 120px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 220px 190px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 290px 160px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 340px 110px, #00ffff, rgba(0,0,0,0)), /* 蓝色星星 */
                        radial-gradient(2px 2px at 390px 200px, #00ffff, rgba(0,0,0,0)),
                        radial-gradient(3px 3px at 50px 250px, #ff00ff, rgba(0,0,0,0)), /* 紫色星星 */
                        radial-gradient(3px 3px at 100px 300px, #ff00ff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 150px 320px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 200px 350px, #fff, rgba(0,0,0,0)),
                        radial-gradient(3px 3px at 250px 380px, #ffff00, rgba(0,0,0,0)); /* 黄色星星 */
            background-repeat: repeat;
            background-size: 400px 400px;
            z-index: -1;
            /* 关键修改：缩短动画时长到10秒，增加闪烁频率 */
            animation: starMove 10s ease-in-out infinite; 
        }

        /* 增强版：明显的闪烁+移动动画 */
        @keyframes starMove {
            0% {
                transform: translate(0, 0);
                opacity: 0.2; /* 初始暗 */
            }
            20% {
                opacity: 1; /* 突然变亮（闪烁核心） */
            }
            40% {
                opacity: 0.5; /* 变暗 */
            }
            60% {
                opacity: 1; /* 又变亮 */
            }
            80% {
                opacity: 0.3; /* 再变暗 */
            }
            100% {
                transform: translate(-20px, -20px); /* 明显移动 */
                opacity: 0.2; /* 回到初始暗 */
            }
        }

        /* 主页标题样式（霓虹发光） */
        .home-title {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
            text-align: center;
            animation: glow 2s ease-in-out infinite alternate;
        }

        /* 标题发光动画 */
        @keyframes glow {
            from { text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff; }
            to { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #00ffff; }
        }

        /* 个人简介卡片（毛玻璃） */
        .profile-card {
            background: rgba(25, 25, 50, 0.7);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            max-width: 600px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .profile-card p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 15px;
            color: #e0e0ff;
        }

        /* 链接容器样式 */
        .links-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            margin-bottom: 50px; /* 给点赞模块留出空间 */
        }

        /* 链接按钮样式 */
        .link-btn {
            background: linear-gradient(45deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            min-width: 180px;
            text-align: center;
            backdrop-filter: blur(3px);
        }

        .link-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 255, 255, 0.4);
            background: linear-gradient(45deg, #fdbb2d, #b21f1f, #1a2a6c);
        }

        /* 点赞模块样式（中下位置） */
        .like-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px; /* 页脚上方间距 */
            position: relative;
        }

        /* 心形样式 */
        .like-icon {
            width: 60px;
            height: 60px;
            border: 3px solid #fff; /* 初始白色轮廓 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 15px;
        }

        /* 心形内部图标 */
        .like-icon::after {
            content: '❤️';
            font-size: 30px;
            color: transparent; /* 初始透明（空白轮廓） */
            -webkit-text-stroke: 2px #fff; /* 白色描边 */
            transition: all 0.3s ease;
        }

        /* 点赞后的心形样式 */
        .like-icon.active::after {
            color: #ff3855; /* 红色填充 */
            -webkit-text-stroke: 0; /* 取消描边 */
        }

        .like-icon.active {
            border-color: #ff3855; /* 边框变红 */
            box-shadow: 0 0 20px rgba(255, 56, 85, 0.6);
        }

        /* 点赞动态效果 */
        @keyframes likeBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes likeSparkle {
            0% { opacity: 1; transform: scale(0); }
            50% { opacity: 0.8; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* 点赞动画触发类 */
        .like-icon.animate {
            animation: likeBounce 0.5s ease-in-out;
        }

        /* 点赞闪光效果 */
        .like-icon::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 56, 85, 0.4);
            opacity: 0;
            z-index: -1;
        }

        .like-icon.animate::before {
            animation: likeSparkle 0.6s ease-in-out;
        }

        /* 点赞数样式 */
        .like-count {
            font-size: 1.2rem;
            color: #e0e0ff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
            font-weight: bold;
        }

        /* 页脚样式 */
        footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.9rem;
            color: #ccccff;
            opacity: 0.7;
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            .home-title {
                font-size: 2.2rem;
            }

            .link-btn {
                min-width: 100%;
                padding: 12px 20px;
            }

            .profile-card {
                padding: 20px;
                margin-bottom: 30px;
            }

            /* 移动端点赞心形缩小 */
            .like-icon {
                width: 50px;
                height: 50px;
            }

            .like-icon::after {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <!-- 主页标题 -->
    <h1 class="home-title">cstdio_luogu的主页</h1>

    <!-- 个人简介卡片 -->
    <div class="profile-card">
        <p>欢迎来到我的个人主页！</p>
        <p>这里汇总了我常用的网页链接，点击下方按钮即可跳转</p>
    </div>

    <!-- 链接容器 - 可自定义修改 -->
    <div class="links-container">
        <a href="https://www.luogu.com.cn/" class="link-btn" target="_blank">洛谷</a>
        <a href="https://atcoder.jp/" class="link-btn" target="_blank">AtCoder</a>
        <a href="https://www.csdn.net/" class="link-btn" target="_blank">CSDN</a>
        <a href="cps.html" class="link-btn" target="_self">CPS测试器</a>
        <a href="map.html" class="link-btn" target="_self">图论</a>
    </div>

    <!-- 点赞模块（中下位置）：移除所有文字说明 -->
    <div class="like-container">
        <div class="like-icon" id="likeIcon"></div>
        <div class="like-count" id="likeCount">0</div>
    </div>

    <!-- 页脚 -->
    <footer>© 2025 cstdio_luogu - 个人主页</footer>

    <script>
        // 点赞功能核心逻辑（支持取消点赞，移除所有文字提示）
        (function() {
            // DOM元素
            const likeIcon = document.getElementById('likeIcon');
            const likeCount = document.getElementById('likeCount');
            
            // localStorage存储键名
            const STORAGE_KEYS = {
                count: 'luogu_home_like_count',
                isLiked: 'luogu_home_is_liked',
                lastDate: 'luogu_home_last_like_date'
            };

            // 获取当前日期（格式：YYYY-MM-DD）
            function getCurrentDate() {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            }

            // 初始化点赞状态
            function initLikeState() {
                // 读取存储的点赞数
                let count = localStorage.getItem(STORAGE_KEYS.count) || 0;
                likeCount.textContent = count;

                // 读取点赞状态和最后点赞日期
                const isLiked = localStorage.getItem(STORAGE_KEYS.isLiked) === 'true';
                const lastDate = localStorage.getItem(STORAGE_KEYS.lastDate) || '';
                const currentDate = getCurrentDate();

                // 如果跨天，重置点赞状态（仅重置选中状态，计数保留）
                if (lastDate !== currentDate) {
                    localStorage.setItem(STORAGE_KEYS.isLiked, 'false');
                    localStorage.setItem(STORAGE_KEYS.lastDate, currentDate);
                    likeIcon.classList.remove('active');
                } else if (isLiked) {
                    // 当天已点赞，设置激活状态
                    likeIcon.classList.add('active');
                }
            }

            // 切换点赞/取消点赞状态（核心修改：支持取消，且每日仅一次有效点赞）
            function toggleLike() {
                const currentDate = getCurrentDate();
                const lastDate = localStorage.getItem(STORAGE_KEYS.lastDate) || currentDate;
                const isLiked = localStorage.getItem(STORAGE_KEYS.isLiked) === 'true';

                // 跨天了，重置点赞状态（允许重新点赞）
                if (lastDate !== currentDate) {
                    localStorage.setItem(STORAGE_KEYS.lastDate, currentDate);
                    localStorage.setItem(STORAGE_KEYS.isLiked, 'false');
                    likeIcon.classList.remove('active');
                }

                // 切换点赞/取消点赞状态
                const newIsLiked = !isLiked;
                let count = Number(localStorage.getItem(STORAGE_KEYS.count) || 0);
                
                if (newIsLiked) {
                    // 点赞：计数+1，激活样式，添加动态效果
                    count += 1;
                    likeIcon.classList.add('active', 'animate');
                } else {
                    // 取消点赞：计数-1，取消激活样式（无动画）
                    count = Math.max(0, count - 1); // 防止计数为负
                    likeIcon.classList.remove('active');
                }

                // 存储新状态（计数和选中状态）
                localStorage.setItem(STORAGE_KEYS.count, count);
                localStorage.setItem(STORAGE_KEYS.isLiked, newIsLiked);
                likeCount.textContent = count;

                // 移除动画类（避免重复触发）
                setTimeout(() => {
                    likeIcon.classList.remove('animate');
                }, 600);
            }

            // 绑定点击事件
            likeIcon.addEventListener('click', toggleLike);

            // 初始化
            initLikeState();
        })();
    </script>
</body>
</html>
